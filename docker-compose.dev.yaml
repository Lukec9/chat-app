services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend_dev_c
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app/backend
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev_c
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules